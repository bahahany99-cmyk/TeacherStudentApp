# ⚠️ `name` معرّف تقني محايد مؤقت (وليس الاسم التجاري).
# الاسم الظاهر للمستخدم مؤقت أيضًا ويُدار من lib/core/config/app_identity.dart.
# راجع قسم "الهوية والاسم المؤقت" في README.md قبل تغييره.
name: teacher_student_app
description: تطبيق عربي (RTL) يربط المدرسين بالطلاب في مصر — Flutter + Firebase.
publish_to: 'none'

# نسخة ما قبل الإطلاق: 0.1.0 -> المرحلة 2 (هيكل أولي فقط، بلا ميزات حقيقية).
version: 0.1.0+1

environment:
  # الحد الأدنى المعلن. المشروع حاليًا يبني على Flutter stable (Dart 3.11).
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  # تعريب Material/Cupertino + دعم RTL (بدون حزم خارجية).
  flutter_localizations:
    sdk: flutter

  # ── P4: أساسيات Firebase ────────────────────────────────────────────────────
  # firebase_core: تهيئة التطبيق فقط.
  firebase_core: ^5.0.0
  # firebase_auth: بريد/كلمة مرور + استبدال بيانات اعتماد Google بـFirebase.
  firebase_auth: '>=5.0.0 <8.0.0'

  # ── P18: تسجيل الدخول بـGoogle عبر الـSDK الأصلي ────────────────────────────
  # لماذا أُضيفت بعد أن كانت مستبعدة؟ `signInWithProvider` (المسار القديم) يفتح
  # متصفحًا ويحتاج إعداد redirect على الويب، وكان يفشل على أندرويد برسالة
  # «لا يوجد اتصال بالإنترنت» رغم وجود شبكة. الحزمة الأصلية تعرض قائمة حسابات
  # Google المدمجة (Credential Manager) ثم نمرّر `idToken` إلى Firebase.
  # minSdk 23 في `tool/scaffold_android.sh` يفي بمتطلبها.
  google_sign_in: ^7.2.0
  # cloud_firestore: نقرأ/نكتب مستند المستخدم `users/{uid}` فقط في هذه المرحلة
  # (الدور المختار عند أول دخول). بقية المستودعات تنتقل إلى Firestore في P5.
  cloud_firestore: '>=5.0.0 <8.0.0'

  # ── P22: صورة الحساب ────────────────────────────────────────────────────────
  # المدرس مطالب بصورة، والطالب يستطيع تغيير صورته من الإعدادات. `image_picker`
  # تعرض منتقي صور النظام (المعرض فقط، بلا إذن كاميرا) وتصغّر الصورة عند
  # الاختيار (`maxWidth`/`imageQuality`) فلا نرفع صور كاميرا خام.
  # المدى المفتوح مقصود: أحدث إصدار يطلب Dart 3.11، والمدى الأدنى يعمل على
  # أقدم SDK يبنيه المشروع، فيبقى الحل صالحًا على قناتَي stable.
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # (P18) توليد أيقونات المنصّة من مصدر واحد (PNG في assets/icon/).
  # يُشغَّل يدويًا: `dart run flutter_launcher_icons` — وناتجه (mipmap/AppIcon)
  # يُولَّد داخل مجلد المنصّة الذي ينشئه `tool/scaffold_android.sh`، فلا نُخزّن
  # مئات ملفات PNG في المستودع بلا حاجة.
  flutter_launcher_icons: ^0.14.4

# هوية أيقونة التطبيق — «درسلي» (P20: الهوية البصرية الجديدة).
#
# **لماذا أربعة ملفات لا صورة واحدة؟** لأن كل منصّة تقصّ الأيقونة بشكل مختلف:
# أندرويد التكيّفي يقصّ الشكل (دائرة/مربع مستدير/قطرة) ويُحرّك الخلفية بتكبير
# 1.5×، وiOS يضع القناع بنفسه. صورة واحدة مسطّحة تُقصّ أطرافها في منصّة
# وتظهر سليمة في أخرى، لذلك نفصل الطبقات:
#
# - `image_path`: الأيقونة الكاملة (خلفية + علامة) — لـiOS والأيقونات القديمة
#   (`mipmap-*/ic_launcher.png`) وأي منصّة لا تدعم التكيّفي.
# - `adaptive_icon_background`: **التدرّج نفسه** (لا لون مسطّح) لطبقة الخلفية،
#   فيبدو العمق كما في التصميم الأصلي. صورة 1024² مموّهة عمدًا حتى لا يُظهر
#   التكبير 1.5× أي حِدّة أو كتلة.
# - `adaptive_icon_foreground`: العلامة وحدها بخلفية شفافة، متمركزة في 58.6%
#   من اللوحة — داخل المنطقة الآمنة (66%) بهامش، فلا يقطعها أي قناع.
# - `adaptive_icon_monochrome`: صورة ظلّية أحادية اللون لأيقونات أندرويد 13+
#   «Themed icons» (تُلوَّن بلوحة النظام). بلا هذا الملف تظهر الأيقونة
#   الملوّنة وسط أيقونات النظام الأحادية، فتبدو غريبة.
# - `remove_alpha_ios`: App Store يرفض شفافية في أيقونة iOS.
#
# إعادة التوليد: `dart run flutter_launcher_icons` (يتطلب `pub get` أولًا).
# اشتقاق الطبقات من الصورة الأم موثّق في `tool/icon/build_icon_assets.py`.
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 23
  adaptive_icon_background: assets/icon/app_icon_background.png
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_monochrome: assets/icon/app_icon_monochrome.png
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    # ⚠️ أيقونات `assets/icon/` **ليست** أصول تشغيل: `flutter_launcher_icons`
    # تقرأها من إعدادها أعلاه وتولّد منها ملفات المنصّة، فلا داعي لتسجيلها هنا
    # (تسجيلها كان سيضخّم الـAPK بصورة 1024px لا تُستخدم وقت التشغيل).
    # شعار Google الرسمي (رباعي الألوان) المستخدم في زر الدخول — P18.
    # راجع assets/images/NOTICE.md لشروط الاستخدام والعلامة التجارية.
    - assets/images/google_g.png

  # خط Cairo (رخصة SIL Open Font License 1.1) — مولَّد كأوزان ثابتة من الخط
  # المتغيّر الرسمي: Regular 400 / SemiBold 600 / Bold 700.
  # الترخيص محفوظ في assets/fonts/OFL.txt (إلزامي عند توزيع الخط).
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
          style: normal
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
          style: normal
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
          style: normal
