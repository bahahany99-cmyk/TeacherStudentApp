name: Build & Verify

# بوابة G10 (معتمدة من صاحب المشروع 2026-10-26):
# بيئة العمل لا تحتوي Flutter/Dart وpub.dev محجوب، لذلك التحقق الآلي الحقيقي
# (analyze / test / APK) يجري على GitHub Actions.
#
# سياسة الموارد (قرار 2026-10-27): كل دفعة (push / PR) تُشغّل **الفحص
# والاختبارات فقط**. بناء APK يجري **يدويًا عند الطلب** عبر workflow_dispatch،
# حفاظًا على مساحة التخزين، لأن كل بناء ينتج APK بحجم ~70 م.ب.

permissions:
  contents: write # لنشر ملخص النتائج كتعليق على الكوميت عند الفشل

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch: # ← الطلب اليدوي فقط هو ما يبني APK

# نُلغي التشغيلات القديمة على نفس الفرع لتوفير دقائق CI.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: analyze · test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain info
        run: |
          flutter --version
          dart --version
          java -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          status=0
          dart analyze --format=machine > /tmp/analyze.txt 2>&1 || status=$?

          if [ "$status" -eq 0 ]; then
            echo "✅ dart analyze: لا أخطاء ولا تحذيرات."
            exit 0
          fi

          echo "❌ analyze فشل — الرسائل:"
          cat /tmp/analyze.txt

          head -10 /tmp/analyze.txt | while IFS='|' read -r sev type code file line col len msg; do
            case "$sev" in
              ERROR)   echo "::error file=$file,line=$line,col=$col::$code: $msg" ;;
              WARNING) echo "::warning file=$file,line=$line,col=$col::$code: $msg" ;;
              INFO)    echo "::notice file=$file,line=$line,col=$col::$code: $msg" ;;
            esac
          done

          exit "$status"

      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: /tmp/analyze.txt
          if-no-files-found: ignore

      - name: Test
        run: |
          set -o pipefail
          status=0
          flutter test --reporter expanded > /tmp/test.txt 2>&1 || status=$?
          tail -120 /tmp/test.txt

          if [ "$status" -ne 0 ]; then
            # سجلات Actions محجوبة عن بيئة العمل، لذا ننشر الناتج كملاحظات API.
            python3 tool/ci/annotate_log.py /tmp/test.txt "flutter-test"
            exit "$status"
          fi

          echo "✅ flutter test: كل الاختبارات ناجحة."

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/test.txt
          if-no-files-found: ignore

  # ── بناء APK: يدوي فقط (Actions ← Run workflow) ──────────────────────────────
  build_apk:
    name: build apk (يدوي)
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Android platform (deterministic, com.darsly.app)
        run: bash tool/scaffold_android.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Report APK
        if: always()
        run: ls -lh build/app/outputs/flutter-apk/ || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # نسخة من مجلد android المولَّد، ليتمكّن صاحب المشروع من إضافته للمستودع
      # مرة واحدة إن أراد (وحتى ذلك الحين، CI يولّده عند كل بناء يدوي).
      - name: Upload generated android folder
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: generated-android-platform
          path: android/
          if-no-files-found: error
          retention-days: 7
