name: Build & Verify

# بوابة G10 (معتمدة من صاحب المشروع 2026-10-26):
# بيئة العمل لا تحتوي Flutter/Dart وpub.dev محجوب، لذلك التحقق الآلي الحقيقي
# (analyze / test / APK) يجري على GitHub Actions.
#
# سياسة الموارد (قرار 2026-10-27، مُحدَّثة):
# - كل دفعة (push / PR): analyze + test + **بناء APK للتحقق فقط بلا رفع**.
#   البناء لا يستهلك مساحة التخزين (المساحة تُستهلك بالـ artifacts المرفوعة)،
#   فبهذا نكتشف أعطال Gradle/الحزم فورًا بدل الانتظار إلى بناء يدوي.
# - الطلب اليدوي (workflow_dispatch): نفس الخطوات + **رفع APK** كـ artifact
#   لتنزيله وتجربته على الهاتف.

permissions:
  contents: write # لنشر ملخص النتائج كتعليق على الكوميت عند الفشل

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch: # ← هذا وحده يرفع APK كـ artifact

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: analyze · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain info
        run: |
          flutter --version
          dart --version
          java -version

      - name: Resolve dependencies
        run: |
          set -o pipefail
          status=0
          flutter pub get > /tmp/pub.txt 2>&1 || status=$?
          cat /tmp/pub.txt

          if [ "$status" -ne 0 ]; then
            # فشل تحليل الإصدارات يُقرأ من الـ annotations (السجلات محجوبة).
            python3 tool/ci/annotate_log.py /tmp/pub.txt "pub-get"
            exit "$status"
          fi

      - name: Analyze
        run: |
          set -o pipefail
          status=0
          dart analyze --format=machine > /tmp/analyze.txt 2>&1 || status=$?

          if [ "$status" -eq 0 ]; then
            echo "✅ dart analyze: لا أخطاء ولا تحذيرات."
            exit 0
          fi

          echo "❌ analyze فشل — الرسائل:"
          cat /tmp/analyze.txt

          head -10 /tmp/analyze.txt | while IFS='|' read -r sev type code file line col len msg; do
            case "$sev" in
              ERROR)   echo "::error file=$file,line=$line,col=$col::$code: $msg" ;;
              WARNING) echo "::warning file=$file,line=$line,col=$col::$code: $msg" ;;
              INFO)    echo "::notice file=$file,line=$line,col=$col::$code: $msg" ;;
            esac
          done

          exit "$status"

      - name: Upload analyze log
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: /tmp/analyze.txt
          if-no-files-found: ignore

      - name: Test
        run: |
          set -o pipefail
          status=0
          flutter test --reporter expanded > /tmp/test.txt 2>&1 || status=$?
          tail -120 /tmp/test.txt

          if [ "$status" -ne 0 ]; then
            # سجلات Actions محجوبة عن بيئة العمل، لذا ننشر الناتج كملاحظات API.
            python3 tool/ci/annotate_log.py /tmp/test.txt "flutter-test"
            exit "$status"
          fi

          echo "✅ flutter test: كل الاختبارات ناجحة."

      - name: Upload test log
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/test.txt
          if-no-files-found: ignore

      - name: Scaffold Android platform (deterministic, com.darsly.app)
        run: bash tool/scaffold_android.sh

      # بناء تحقّق فقط: يثبت أن Gradle + Firebase Android يعملان، بلا رفع.
      - name: Build debug APK (verification)
        run: |
          set -o pipefail
          status=0
          flutter build apk --debug > /tmp/build.txt 2>&1 || status=$?
          tail -60 /tmp/build.txt

          if [ "$status" -ne 0 ]; then
            # فشل Gradle يُقرأ من الـ annotations لأن السجلات محجوبة.
            python3 tool/ci/annotate_log.py /tmp/build.txt "apk-build"
            exit "$status"
          fi

          ls -l build/app/outputs/flutter-apk/app-debug.apk
          echo "✅ APK جُرِّب بناؤه بنجاح (بدون رفع في وضع الدفع)."

      # تسليم APK بلا الحاجة إلى workflow_dispatch (الذي لا يملكه وكيل التطوير):
      # أي دفعة تحتوي «[apk]» في رسالة الكوميت تنشر Release مرفقًا به الملف.
      # Releases لا تُحتسب من مساحة الـ artifacts.
      - name: Publish APK release (عند كلمة [apk] في رسالة الكوميت)
        if: >-
          success() && github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[apk]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          tag="apk-${short}"
          gh release create "$tag" \
            build/app/outputs/flutter-apk/app-debug.apk \
            --title "APK تجريبي ${short} — وضع الزائر" \
            --notes "بناء تلقائي لوضع الزائر (بيانات تجريبية، بلا Firebase). الفرع: ${GITHUB_REF_NAME}. الإصدار: ${short}." \
            --repo "${GITHUB_REPOSITORY}"

      - name: Upload APK artifact (يدوي فقط)
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
