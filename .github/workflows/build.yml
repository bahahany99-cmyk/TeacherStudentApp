name: Build & Verify

# بوابة G10 (معتمدة من صاحب المشروع 2026-10-26):
# بيئة العمل لا تحتوي Flutter/Dart وpub.dev محجوب، لذلك التحقق الآلي الحقيقي
# (analyze / test / APK) يجري على GitHub Actions.

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

# نُلغي التشغيلات القديمة على نفس الفرع لتوفير دقائق CI.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: analyze · test · apk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain info
        run: |
          flutter --version
          dart --version
          java -version

      - name: Scaffold Android platform (deterministic, com.darsly.app)
        run: bash tool/scaffold_android.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Report APK
        if: always()
        run: |
          ls -lh build/app/outputs/flutter-apk/ || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # نسخة من مجلد android المولَّد، ليتمكّن صاحب المشروع من إضافته للمستودع
      # مرة واحدة إن أراد (وحتى ذلك الحين، CI يولّده في كل تشغيل).
      - name: Upload generated android folder
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: generated-android-platform
          path: android/
          if-no-files-found: error
          retention-days: 14
