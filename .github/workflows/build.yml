name: Build & Verify

# بوابة G10 (معتمدة من صاحب المشروع 2026-10-26):
# بيئة العمل لا تحتوي Flutter/Dart وpub.dev محجوب، لذلك التحقق الآلي الحقيقي
# (analyze / test / APK) يجري على GitHub Actions.

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

# نُلغي التشغيلات القديمة على نفس الفرع لتوفير دقائق CI.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: analyze · test · apk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain info
        run: |
          flutter --version
          dart --version
          java -version

      - name: Scaffold Android platform (deterministic, com.darsly.app)
        run: bash tool/scaffold_android.sh

      - name: Resolve dependencies
        run: flutter pub get

      # التحليل يُنشر أيضًا كتعليق على الكوميت، لأن سجلات Actions محجوبة عن
      # بيئة العمل الحالية (الوصول لـ blob storage غير متاح) — هكذا تبقى
      # نتائج التحليل قابلة للقراءة والمراجعة.
      - name: Analyze
        id: analyze
        run: |
          set -o pipefail
          status=0
          dart analyze --format=machine > /tmp/analyze.txt 2>&1 || status=$?

          if [ "$status" -eq 0 ]; then
            echo "✅ flutter/dart analyze: لا أخطاء ولا تحذيرات."
            exit 0
          fi

          echo "❌ analyze فشل — الرسائل:"
          cat /tmp/analyze.txt

          # ملاحظات داخل صفحة التشغيل (أول 10 رسائل).
          head -10 /tmp/analyze.txt | while IFS='|' read -r sev type code file line col len msg; do
            case "$sev" in
              ERROR)   echo "::error file=$file,line=$line,col=$col::$code: $msg" ;;
              WARNING) echo "::warning file=$file,line=$line,col=$col::$code: $msg" ;;
              INFO)    echo "::notice file=$file,line=$line,col=$col::$code: $msg" ;;
            esac
          done

          # التعليق الكامل على الكوميت (قابل للقراءة عبر API).
          {
            echo "### نتيجة \`dart analyze\` (فشل)"
            echo
            echo '```'
            head -250 /tmp/analyze.txt
            echo '```'
          } > /tmp/comment.md

          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/comment.md)" \
            -H "Accept: application/vnd.github+json" || echo "تعذّر نشر التعليق."

          exit "$status"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: /tmp/analyze.txt
          if-no-files-found: ignore

      - name: Test
        run: flutter test --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Report APK
        if: always()
        run: |
          ls -lh build/app/outputs/flutter-apk/ || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # نسخة من مجلد android المولَّد، ليتمكّن صاحب المشروع من إضافته للمستودع
      # مرة واحدة إن أراد (وحتى ذلك الحين، CI يولّده في كل تشغيل).
      - name: Upload generated android folder
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: generated-android-platform
          path: android/
          if-no-files-found: error
          retention-days: 14
